services:
  - type: web
    name: gestao-processos-sti
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: EMAIL_ENABLED
        value: "false"
